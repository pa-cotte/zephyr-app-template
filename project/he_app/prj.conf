#### Serial config ####
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

#### Shell config ####
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_PROMPT_UART="asterix:~$ "
CONFIG_SHELL_DEFAULT_TERMINAL_WIDTH=256
CONFIG_SHELL_HELP=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=256
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_REBOOT=y

CONFIG_LOG=y

CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_DEVICE_SHELL=y

CONFIG_I3C=y
CONFIG_I3C_USE_IBI=n
CONFIG_PINCTRL=y
CONFIG_I3C_SHELL=y
CONFIG_I3C_LOG_LEVEL_DBG=y
CONFIG_I3C_DW=y
CONFIG_I3C_DW_LOG_LEVEL_DBG=y

CONFIG_PWM=y
CONFIG_PWM_LOG_LEVEL_DBG=y
CONFIG_PWM_PCA9685=y