manifest:
    
  remotes:
    - name: alif
      url-base: https://github.com/alifsemi
    - name: armmbed
      url-base: https://github.com/ARMmbed
    - name: pacotte
      url-base: https://github.com/pa-cotte

  projects:
    - name: zephyr
      remote: pacotte
      revision: murata_1lv_wifi_zephyr_3_7_0
      repo-path: zephyr_alif
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - segger       
          - liblc3
          - mbedtls
          - net-tools   # Alif based boards network util tools
          - hal_alif    # required by the Alif based boards
          - hal_ethos_u # required by the Alif based boards for npu
          - hal_infineon # required by murata 1LV board (wifi & bluetooth)

    - name: mcuboot_alif
      remote: alif
      repo-path: mcuboot_alif
      path: bootloader/mcuboot
      revision: main

    - name: cmsis_alif
      remote: alif
      revision: 85f6b92af0f6ac72594d391f895c45cc30847e41
      path: modules/hal/cmsis
      groups:
         - hal
  self:
    path: alif
    west-commands: scripts/west-commands.yml